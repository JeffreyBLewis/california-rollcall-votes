name: Update rollcall data

on:
  schedule:
    # Every Monday at 13:00 UTC (~5-6am Pacific, depending on DST)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      year:
        description: 'Session start year to fetch (e.g. 2023). Leave blank for the current session.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::targets
            any::curl

      - name: Run data pipeline
        working-directory: R
        env:
          ROLLCALL_YEAR: ${{ inputs.year }}
        run: Rscript -e 'targets::tar_make()'

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.zip
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Weekly data update"
            git push
          fi
